name: Build and deploy Vocab App backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ins_clone_be:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ins_clone_be:${{ github.sha }}

      - name: Config SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keyscan \
            -p "$SERVER_PORT" \
            "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy backend
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'
          
            set -e
          
            cd /data/bachdd/ins_clone-deploy
          
            echo "Pulling backend image..."
            docker compose pull backend
          
            echo "Starting backend..."
            docker compose --env-file ../environment_variable/.env.backend  up -d --force-recreate backend
          
            echo "Current containers:"
            docker compose ps
          
          EOF